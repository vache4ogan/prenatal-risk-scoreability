data:
  cdc2022: data/cdc_temporal_harmonized/cdc_natality_2022_harmonized.csv
  cdc2023: data/cdc_temporal_harmonized/cdc_natality_2023_harmonized.csv
  feature_sets: data/cdc_factorial_design/feature_sets.json
  expected_rows:
    '2022': 3676029
    '2023': 3605081
  verify_input_hashes: true
output:
  directory: results/article_revision_fixed_model
  overwrite: false
  save_models: true
  upload_models_to_clearml: true
  save_predictions: false
  upload_predictions_to_clearml: false
split:
  seed: 2026
  calibration_fraction: 0.2
cohorts:
  primary_population: is_us_resident == 1 and is_singleton == 1
  all_births_sensitivity_population: is_us_resident == 1
  early_entry_min_month: 1
  early_entry_max_month: 3
targets:
- target_preterm
- target_nicu
- target_lbw
feature_sets:
- booking_strict
model:
  name: lightgbm
  parameters:
    objective: binary
    n_estimators: 350
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 100
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    class_weight: null
    scale_pos_weight: 1.0
    random_state: 2026
    n_jobs: -1
    verbosity: -1
    device_type: cpu
preprocessing:
  categorical_features:
  - mother_race
  - marital_status
  - mother_educ
  numeric_imputation: median
  categorical_imputation: most_frequent
  standardize_numeric: true
fixed_absolute_budget:
  fractions_of_full_population:
  - 0.05
  - 0.1
  scenarios:
  - early_entry
  - full_cohort
bootstrap:
  enabled: true
  replicates: 500
  seed: 2027
  confidence_level: 0.95
  evaluations:
  - calibration_evaluation_2022
  - temporal_test_2023
  full_size: true
  paired: true
  progress_every: 25
mechanism:
  evaluation: temporal_test_2023
  budget_fraction_of_full_population: 0.1
  groups:
  - months_1_3
  - after_month_3
  - no_prenatal_care
  - unknown
probability_calibration:
  method: platt_sigmoid
  fit_fraction_within_calibration_pool: 0.5
  partition_seed: 2028
  clip_eps: 1.0e-06
  curve_bins: 20
  optimizer_max_iter: 300
execution:
  expected_singleton_model_count: 3
  expected_all_birth_model_count: 3
  expected_total_model_count: 6
