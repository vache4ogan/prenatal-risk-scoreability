[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prenatal-scoreability"
version = "0.1.0"
description = "Article-oriented fixed-model equal-budget prenatal scoreability analysis"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "clearml",
  "python-dotenv",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "lightgbm",
  "PyYAML",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

# Canonical replay core versions are pinned in requirements-replication.txt;
# their source is results/tae_2026_canonical/package_versions.txt.
# The unpinned project dependencies above are not a reproduction lockfile.
